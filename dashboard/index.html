<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <meta name="theme-color" content="#0e0b06" />
    <title>nobrainr · commonplace book</title>
    <style>
      /* System serif stack — Georgia / Palatino are pre-installed on every
         platform, no font fetch latency. Used everywhere in the app to
         maintain the commonplace book aesthetic. */
      body {
        font-family: Georgia, 'Palatino Linotype', Palatino, 'Hoefler Text', serif;
        margin: 0;
        background: #0e0b06;
        color: rgba(238, 224, 196, 0.94);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: rgba(14, 11, 6, 0.3); }
      ::-webkit-scrollbar-thumb {
        background: rgba(200, 169, 110, 0.2);
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(200, 169, 110, 0.4);
        background-clip: padding-box;
      }
      ::selection {
        background: rgba(200, 169, 110, 0.3);
        color: rgba(238, 224, 196, 0.98);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
