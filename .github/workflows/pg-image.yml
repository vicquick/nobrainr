name: Postgres image

# Builds ghcr.io/vicquick/nobrainr-postgres (pgvector + Debian security
# updates). Weekly so new Debian fixes arrive without a code change.
on:
  push:
    branches: [main]
    paths: ["docker/postgres/**", ".github/workflows/pg-image.yml"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: docker/postgres
          pull: true
          push: true
          tags: |
            ghcr.io/vicquick/nobrainr-postgres:pg18-bookworm
            ghcr.io/vicquick/nobrainr-postgres:pg18-bookworm-${{ github.run_number }}
