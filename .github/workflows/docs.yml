name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml"]

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    # vic 24.11.2026 (ceo 01a20c77): keine GitHub-gehosteten Jobs mehr — eigener Runner; Fork-PRs nie auf eigenen Runner
    runs-on: [self-hosted, nobrainr]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install mkdocs-material

      - run: mkdocs build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - id: deployment
        uses: actions/deploy-pages@v5
