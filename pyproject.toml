[project]
name = "nobrainr"
version = "0.2.0"
description = "Persistent memory and knowledge graph for AI agents via MCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["mcp", "ai-memory", "knowledge-graph", "ai-agents", "pgvector", "ollama", "claude-code", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp[cli]>=1.9.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "click>=8.1.0",
    "rich>=13.9.0",
    "starlette>=0.41.0",
    "uvicorn>=0.32.0",
    "numpy>=1.26.0",
    "networkx>=3.0",
    "scipy>=1.12.0",
    "pyyaml>=6.0",
    "python-docx>=1.0",
    "pymupdf>=1.25.0",
    "umap-learn>=0.5.0",
    "scikit-learn>=1.4.0",
    # Cross-encoder reranking.
    # Primary: sentence-transformers with BAAI/bge-reranker-v2-m3 — multilingual
    # (100+ languages including German/Dutch/Spanish that dominate a large slice
    # of our corpus), cross-encoder, ~560MB weights. See services/reranker.py.
    # Fallback: flashrank ONNX (English-only MiniLM) for environments where
    # torch cannot be installed.
    "sentence-transformers>=3.3.0",
    "flashrank>=0.2.10",
    # Leiden community detection — strictly better than Louvain (guaranteed
    # connected clusters, near-linear on dense hub graphs). See services/communities.py.
    "leidenalg>=0.10.2",
    "python-igraph>=0.11.6",
]

[project.urls]
Repository = "https://github.com/vicquick/nobrainr"
Documentation = "https://github.com/vicquick/nobrainr#readme"
Issues = "https://github.com/vicquick/nobrainr/issues"
Changelog = "https://github.com/vicquick/nobrainr/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8.0",
]

[project.scripts]
nobrainr = "nobrainr.cli:main"
nobrainr-mcp = "nobrainr.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nobrainr"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
